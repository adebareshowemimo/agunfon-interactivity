<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modern Commerce icon</title>
<!--
  On-brand marketplace/app icon for local_moderncommerce — agunfon brand gradient,
  shopping-bag glyph (commerce). Render the .icon element to PNG at 512x512
  (well above the 200x200 marketplace minimum).
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#fff;}
  .icon{position:relative;width:512px;height:512px;border-radius:112px;overflow:hidden;
    background:linear-gradient(140deg,#4B8BE8 0%,#0F3D7A 100%);
    display:flex;align-items:center;justify-content:center;}
  /* soft highlight + decorative ring */
  .icon::before{content:"";position:absolute;top:-120px;left:-80px;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.25),transparent 60%);}
  .ring{position:absolute;width:520px;height:520px;border-radius:50%;border:34px solid rgba(255,255,255,.06);
    right:-180px;bottom:-180px;}
  /* shopping-bag glyph */
  .glyph{position:relative;z-index:1;width:220px;height:220px;color:#fff;
    filter:drop-shadow(0 18px 30px rgba(6,24,51,.45));}
</style>
</head>
<body>
  <div class="icon">
    <div class="ring"></div>
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
         xmlns="http://www.w3.org/2000/svg">
      <path d="M6 8.5h12l-.86 10.4A2.2 2.2 0 0 1 14.95 21H9.05a2.2 2.2 0 0 1-2.19-2.1L6 8.5Z"/>
      <path d="M9 9V7a3 3 0 0 1 6 0v2"/>
    </svg>
  </div>
</body>
</html>
