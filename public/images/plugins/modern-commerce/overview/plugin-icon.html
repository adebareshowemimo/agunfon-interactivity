<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modern Commerce icon</title>
<!--
  On-brand marketplace/app icon for local_moderncommerce — agunfon brand gradient,
  shopping-bag glyph (commerce). Render the .icon element to PNG at 512x512
  (well above the 200x200 marketplace minimum).
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#fff;}
  .icon{position:relative;width:512px;height:512px;border-radius:112px;overflow:hidden;
    background:linear-gradient(140deg,#4B8BE8 0%,#0F3D7A 100%);
    display:flex;align-items:center;justify-content:center;}
  /* soft top-left highlight */
  .icon::before{content:"";position:absolute;top:-140px;left:-100px;width:460px;height:460px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.28),transparent 62%);}
  /* decorative rings, bottom-right */
  .ring{position:absolute;width:540px;height:540px;border-radius:50%;border:36px solid rgba(255,255,255,.07);
    right:-190px;bottom:-190px;}
  .ring2{position:absolute;width:300px;height:300px;border-radius:50%;border:26px solid rgba(255,255,255,.05);
    right:-70px;bottom:-70px;}
  /* shopping-bag glyph (lucide shopping-bag) */
  .glyph{position:relative;z-index:1;width:250px;height:250px;color:#fff;
    filter:drop-shadow(0 20px 34px rgba(6,24,51,.50));}
</style>
</head>
<body>
  <div class="icon">
    <div class="ring"></div>
    <div class="ring2"></div>
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
         xmlns="http://www.w3.org/2000/svg">
      <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
      <path d="M3 6h18"/>
      <path d="M16 10a4 4 0 0 1-8 0"/>
    </svg>
  </div>
</body>
</html>
